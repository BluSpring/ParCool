buildscript {
    repositories {
    }
}
plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'fabric-loom' version '1.14-SNAPSHOT'
}


tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

//Version Format (MajorMOD.MajorAPI.Minor.Patch)
version = "${minecraft_version}-${mod_version}-Fabric"
group = 'com.alrex'
repositories {
    mavenLocal()
    maven { url = 'https://www.cursemaven.com' }
}
base {
    archivesName = "ParCool"
}

loom {
    accessWidenerPath = file("src/main/resources/parcool.accesswidener")
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Include resources generated by data generators.
//sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven { url = 'https://maven.blamejared.com' }
    maven { url = "https://maven.parchmentmc.org" }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url = "https://api.modrinth.com/maven" }
}
dependencies {
    minecraft "com.mojang:minecraft:$project.minecraft_version"

    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-$project.parchment_minecraft_version:$project.parchment_mappings_version@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version"

    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:$project.forgeconfigapiport_version"

    //runtimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}"

    modCompileOnly "curse.maven:ShoulderSurfing-243190:6993826"
    modCompileOnly "curse.maven:BetterThirdPerson-435044:6455829"

    include(modImplementation("maven.modrinth:additionalentityattributes:2.2.0+1.21.8"))
}

processResources {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            fabric_loader_version   : fabric_loader_version,
            mod_id                 : mod_id,
            mod_name               : "ParCool",
            mod_license: mod_license,
            mod_version: mod_version,
            forgeconfigapiport_version: forgeconfigapiport_version
    ]

    inputs.properties(replaceProperties)

    filesMatching("fabric.mod.json") {
        expand(replaceProperties)
    }
}

jar {
    manifest {
        attributes([
                "Implementation-Version": "${mod_version}",
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}